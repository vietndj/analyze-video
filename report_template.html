<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>%%PAGE_TITLE%%</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230B0F19'/%3E%3Crect x='1' y='1' width='62' height='62' rx='15' fill='none' stroke='%23FFFFFF' stroke-opacity='0.12' stroke-width='1.5'/%3E%3Ctext x='32' y='38' text-anchor='middle' font-family='system-ui, sans-serif' font-weight='900' font-size='23' fill='%23FFFFFF'%3EYT%3C/text%3E%3Ccircle cx='48' cy='18' r='4' fill='%23eab308'/%3E%3C/svg%3E">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'FD Aeonik Extended';
            src: url('https://font.fedu.vn/FDAeonikExtended-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'FD Aeonik';
            src: url('https://font.fedu.vn/FDAeonik-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'FD Aeonik';
            src: url('https://font.fedu.vn/FDAeonik-SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Tiempos Text';
            src: url('https://font.fedu.vn/TiemposText-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'JetBrains Mono';
            src: url('https://font.fedu.vn/JetBrainsMono-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'JetBrains Mono';
            src: url('https://font.fedu.vn/JetBrainsMono-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --cl-bg: #ffffff;
            --cl-tint: #f8fafc;
            --cl-card: #ffffff;
            --cl-accent: #1a73e8;
            --cl-accent-tint: rgba(26, 115, 232, 0.08);
            --cl-text-base: #090d16;
            --cl-text-body: #0f172a;
            --cl-text-muted: #475569;
            --cl-line: rgba(0, 0, 0, 0.06);
            --cl-line-strong: rgba(0, 0, 0, 0.12);
            --cl-danger: #dc2626;
            --cl-success: #16a34a;
            --cl-radius-lg: 24px;
            --cl-radius-md: 16px;
            --cl-radius-sm: 10px;
            --cl-radius-full: 9999px;
            --font-display: 'FD Aeonik Extended', 'Inter', -apple-system, sans-serif;
            --font-body: 'Tiempos Text', 'FD Aeonik', 'Inter', Georgia, serif;
            --font-ui: 'FD Aeonik', 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --apple-spring: cubic-bezier(0.25, 1, 0.35, 1.05);
            --apple-ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* General Body */
        body {
            background: var(--cl-bg);
            color: var(--cl-text-body);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* Video Sidebar */
        .video-sidebar {
            width: 420px;
            max-width: 420px;
            position: sticky;
            top: 0;
            height: 100vh;
            background: var(--cl-tint);
            border-right: 1px solid var(--cl-line);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 16px;
        }

        .video-wrap {
            width: 100%;
            aspect-ratio: 9/16;
            max-height: 70vh;
            border-radius: var(--cl-radius-md);
            overflow: hidden;
            background: #000;
            position: relative;
        }

        .video-wrap video, .video-wrap iframe {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: none;
        }

        .video-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .speed-row, .action-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 500;
            padding: 6px 12px;
            border: 1px solid var(--cl-line-strong);
            background: var(--cl-card);
            color: var(--cl-text-muted);
            border-radius: var(--cl-radius-full);
            cursor: pointer;
            transition: all 0.2s var(--apple-ease);
        }

        .ctrl-btn:hover {
            border-color: var(--cl-accent);
            color: var(--cl-accent);
        }

        .ctrl-btn.active {
            background: var(--cl-accent);
            color: white;
            border-color: var(--cl-accent);
        }

        #shotStatusTag {
            font-family: var(--font-mono);
            font-size: 12px;
            text-align: center;
            color: var(--cl-accent);
            background: var(--cl-accent-tint);
            padding: 6px 12px;
            border-radius: var(--cl-radius-full);
            margin-top: 8px;
            word-break: break-all;
        }

        /* Content Column */
        .content-column {
            flex: 1;
            padding: 32px 40px;
            overflow-y: auto;
            max-width: 1000px;
        }

        /* Report Header */
        .report-header {
            margin-bottom: 32px;
        }

        .header-badges {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .header-badges span {
            background: var(--cl-accent-tint);
            color: var(--cl-accent);
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: var(--cl-radius-full);
        }

        .report-title {
            font-family: var(--font-ui);
            font-size: clamp(22px, 3vw, 32px);
            font-weight: 600;
            color: var(--cl-text-base);
            margin-bottom: 16px;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }

        .report-title a {
            color: inherit;
        }
        .report-title a:hover {
            text-decoration: underline;
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-ui);
            font-size: 14px;
            color: var(--cl-text-muted);
            flex-wrap: wrap;
        }

        .creator-link {
            color: var(--cl-accent);
            font-weight: 600;
        }

        .hub-link {
            margin-left: auto;
            color: var(--cl-text-muted);
            font-weight: 500;
            text-decoration: underline;
        }

        .hub-link:hover {
            color: var(--cl-accent);
        }

        .meta-dot {
            opacity: 0.5;
        }

        /* Script Axis */
        .script-axis-card {
            background: var(--cl-tint);
            border: 1px solid var(--cl-line);
            border-radius: var(--cl-radius-md);
            padding: 16px 20px;
            margin-bottom: 24px;
        }
        .script-axis-title {
            text-transform: uppercase;
            font-family: var(--font-display);
            font-size: 13px;
            color: var(--cl-accent);
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }
        .script-axis-content {
            font-family: var(--font-ui);
            font-size: 15px;
            color: var(--cl-text-body);
        }

        /* Overview */
        .overview-card {
            background: var(--cl-tint);
            border-radius: var(--cl-radius-md);
            padding: 20px 24px;
            border: 1px solid var(--cl-line);
            margin-bottom: 24px;
            font-size: 16px;
            line-height: 1.6;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 24px 0 16px;
        }

        .tab-group {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            font-family: var(--font-ui);
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--cl-text-muted);
            border-radius: var(--cl-radius-full);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: var(--cl-line);
        }

        .tab-btn.active {
            background: var(--cl-accent);
            color: white;
        }

        .drawer-btn {
            font-family: var(--font-ui);
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border: 1px solid var(--cl-line-strong);
            background: var(--cl-card);
            border-radius: var(--cl-radius-full);
            cursor: pointer;
        }

        /* Shot Cards */
        #storyboardView {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .shot-card {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: var(--cl-card);
            border: 1px solid var(--cl-line);
            border-radius: var(--cl-radius-md);
            transition: border-color 0.2s var(--apple-ease);
        }

        .shot-card:hover {
            border-color: var(--cl-accent);
        }

        .shot-card.active-playing {
            border-color: var(--cl-accent);
            box-shadow: 0 0 0 2px var(--cl-accent-tint);
        }

        .shot-thumb {
            width: 130px;
            flex-shrink: 0;
            border-radius: var(--cl-radius-sm);
            overflow: hidden;
            position: relative;
            cursor: pointer;
            aspect-ratio: 9/16;
            background: #000;
        }

        .shot-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.9;
            transition: transform 0.3s var(--apple-ease), opacity 0.3s;
        }
        
        .shot-thumb:hover img {
            transform: scale(1.05);
            opacity: 1;
        }

        .shot-play-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .shot-thumb:hover .shot-play-icon {
            opacity: 1;
        }
        
        .shot-play-icon svg {
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
        }

        .shot-time-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        .shot-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .shot-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .shot-num {
            font-family: var(--font-mono);
            font-size: 11.5px;
            font-weight: 700;
            color: var(--cl-accent);
            background: var(--cl-accent-tint);
            padding: 4px 10px;
            border-radius: var(--cl-radius-full);
            letter-spacing: 0.05em;
        }
        
        .shot-dur {
            font-family: var(--font-ui);
            font-size: 13px;
            color: var(--cl-text-muted);
            font-weight: 500;
        }

        .shot-headline {
            font-family: var(--font-ui);
            font-size: 18px;
            font-weight: 600;
            color: var(--cl-text-base);
            margin: 0 0 10px 0;
            line-height: 1.35;
        }

        .shot-insight {
            font-family: var(--font-body);
            font-size: 16px;
            color: var(--cl-text-body);
            line-height: 1.6;
            margin: 0;
        }

        .shot-details {
            margin-top: 16px;
            background: var(--cl-tint);
            border-radius: var(--cl-radius-sm);
            border: 1px solid var(--cl-line);
        }

        .shot-details summary {
            font-family: var(--font-ui);
            font-size: 13.5px;
            color: var(--cl-text-muted);
            font-weight: 500;
            cursor: pointer;
            padding: 10px 14px;
            user-select: none;
            transition: color 0.2s;
        }
        
        .shot-details summary:hover {
            color: var(--cl-accent);
        }
        
        .shot-details[open] summary {
            border-bottom: 1px solid var(--cl-line);
            color: var(--cl-accent);
            margin-bottom: 12px;
        }

        .shot-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 20px;
            padding: 0 14px 12px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-label {
            font-family: var(--font-ui);
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--cl-text-muted);
            font-weight: 600;
        }
        
        .meta-val {
            font-family: var(--font-ui);
            font-size: 14px;
            color: var(--cl-text-base);
            line-height: 1.4;
        }

        .critique-good, .critique-warn, .shot-narrative {
            margin: 0 14px 12px;
            padding: 10px 14px;
            border-radius: 6px;
            font-family: var(--font-ui);
            font-size: 13.5px;
            line-height: 1.5;
        }

        .critique-good {
            background: #f0fdf4;
            border-left: 3px solid var(--cl-success);
            color: #166534;
        }

        .critique-warn {
            background: #fffbeb;
            border-left: 3px solid #f59e0b;
            color: #b45309;
        }
        
        .shot-narrative {
            background: var(--cl-card);
            border: 1px solid var(--cl-line);
            color: var(--cl-text-muted);
            font-style: italic;
        }


        /* Grid View */
        #gridView {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        
        .grid-item {
            cursor: pointer;
        }

        .grid-thumb {
            width: 100%;
            aspect-ratio: 9/16;
            border-radius: var(--cl-radius-sm);
            overflow: hidden;
            position: relative;
            background: #000;
            margin-bottom: 4px;
        }

        .grid-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grid-title {
            font-family: var(--font-ui);
            font-size: 12px;
            color: var(--cl-text-body);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Drawer */
        .drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
        }

        .drawer-backdrop.open {
            display: flex;
            justify-content: flex-end;
        }

        .drawer-panel {
            width: 340px;
            max-width: 90vw;
            height: 100vh;
            background: var(--cl-card);
            border-left: 1px solid var(--cl-line);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .drawer-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--cl-line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 14px;
            color: var(--cl-text-base);
        }

        .drawer-head button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--cl-text-muted);
        }

        .drawer-list {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Lightbox */
        #lightboxModal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .lightbox-x {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        #lightboxImg {
            max-width: 90%;
            max-height: 80vh;
            border-radius: var(--cl-radius-md);
        }

        #lightboxCaption {
            margin-top: 16px;
            color: white;
            font-family: var(--font-ui);
            font-size: 16px;
            text-align: center;
        }

        /* Dialogue Section */
        .dialogue-section {
            display: flex;
            gap: 24px;
            margin-bottom: 32px;
        }

        .dialogue-col-main {
            flex: 1;
            background: var(--cl-card);
            border: 1px solid var(--cl-line);
            border-radius: var(--cl-radius-md);
            overflow: hidden;
        }

        .dialogue-col-aside {
            flex: 0 0 320px;
            background: var(--cl-tint);
            border: 1px solid var(--cl-line);
            border-radius: var(--cl-radius-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .dialogue-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--cl-line);
            background: var(--cl-card);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .dialogue-aside-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--cl-line);
            background: var(--cl-tint);
            display: flex;
            align-items: center;
        }

        .dialogue-badge {
            font-family: var(--font-ui);
            font-size: 11px;
            font-weight: 700;
            color: white;
            background: var(--cl-text-base);
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 0.05em;
        }

        .dialogue-sub {
            font-family: var(--font-ui);
            font-size: 13.5px;
            font-weight: 600;
            color: var(--cl-text-muted);
        }

        .dialogue-aside-header span {
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: 700;
            color: var(--cl-text-muted);
            letter-spacing: 0.05em;
        }

        .dialogue-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .dialogue-aside-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            max-height: 400px;
        }

        .vn-para {
            cursor: pointer;
            padding: 14px;
            border-radius: var(--cl-radius-sm);
            transition: background 0.2s var(--apple-ease);
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid transparent;
        }

        .vn-para:hover {
            background: var(--cl-tint);
            border-color: var(--cl-line);
        }

        .vn-time {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--cl-text-muted);
        }

        .vn-beat {
            font-family: var(--font-ui);
            font-size: 13.5px;
            font-weight: 600;
            color: var(--cl-accent);
        }

        .vn-text {
            font-family: var(--font-body);
            font-size: 17px;
            line-height: 1.6;
            color: var(--cl-text-body);
        }

        .en-line {
            cursor: pointer;
            padding: 10px 14px;
            border-radius: var(--cl-radius-sm);
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .en-line:hover {
            background: rgba(0,0,0,0.03);
        }

        .en-time {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--cl-text-muted);
        }

        .en-text {
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--cl-text-muted);
            font-style: italic;
            line-height: 1.5;
        }

        /* Remake Prompt Card */
        .remake-prompt-card {
            background: var(--cl-card);
            border: 1px solid var(--cl-accent);
            border-radius: var(--cl-radius-md);
            margin-bottom: 32px;
            box-shadow: 0 4px 20px var(--cl-accent-tint);
            overflow: hidden;
        }

        .prompt-accordion-header {
            padding: 16px 20px;
            background: #f0f7ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
            border-bottom: 1px solid transparent;
        }

        .prompt-accordion-header:hover {
            background: #e0efff;
        }

        .prompt-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .prompt-badge {
            font-family: var(--font-ui);
            font-size: 11px;
            font-weight: 700;
            color: white;
            background: var(--cl-accent);
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 0.05em;
        }

        .prompt-title {
            font-family: var(--font-ui);
            font-size: 15px;
            font-weight: 600;
            color: var(--cl-text-base);
        }

        .prompt-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .prompt-copy-btn {
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            color: var(--cl-text-base);
            background: white;
            border: 1px solid var(--cl-line-strong);
            padding: 6px 12px;
            border-radius: var(--cl-radius-sm);
            cursor: pointer;
            transition: all 0.2s;
        }

        .prompt-copy-btn:hover {
            border-color: var(--cl-accent);
            color: var(--cl-accent);
        }

        .prompt-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--cl-text-muted);
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 500;
        }

        .prompt-accordion-body {
            padding: 24px;
            border-top: 1px solid #e0efff;
        }

        .prompt-desc {
            font-family: var(--font-ui);
            font-size: 14.5px;
            color: var(--cl-text-muted);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .prompt-code-wrap {
            border: 1px solid var(--cl-line);
            border-radius: var(--cl-radius-sm);
            overflow: hidden;
        }

        .prompt-code-bar {
            background: var(--cl-tint);
            padding: 10px 16px;
            border-bottom: 1px solid var(--cl-line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--cl-text-muted);
        }

        .prompt-code-content {
            padding: 20px;
            font-family: var(--font-mono);
            font-size: 13.5px;
            line-height: 1.6;
            color: var(--cl-text-base);
            background: white;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .dialogue-section {
                flex-direction: column;
            }
            .dialogue-col-aside {
                flex: none;
                max-height: 300px;
            }
            .prompt-accordion-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .prompt-right {
                width: 100%;
                justify-content: space-between;
            }
        }

        /* Mobile Responsive */
        @media (max-width: 1024px) {
            .app-container {
                flex-direction: column;
            }
            .video-sidebar {
                width: 100%;
                max-width: 100%;
                position: relative;
                height: auto;
                padding: 16px;
                border-right: none;
                border-bottom: 1px solid var(--cl-line);
            }
            .content-column {
                padding: 20px 16px;
            }
            .shot-card {
                flex-direction: column;
            }
            .shot-thumb {
                width: 100%;
                aspect-ratio: 16/9;
            }
            #gridView {
                grid-template-columns: repeat(2, 1fr);
            }
            .hub-link {
                width: 100%;
                margin-left: 0;
                margin-top: 8px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="video-sidebar">
        <div class="video-wrap">
            %%VIDEO_PLAYER_HTML%%
        </div>
        <div class="video-controls">
            <div class="speed-row">
                <button class="ctrl-btn" onclick="setSpeed(0.25, this)">0.25x</button>
                <button class="ctrl-btn" onclick="setSpeed(0.5, this)">0.5x</button>
                <button class="ctrl-btn active" onclick="setSpeed(1, this)">1.0x</button>
                <button class="ctrl-btn" onclick="setSpeed(1.5, this)">1.5x</button>
            </div>
            <div class="action-row">
                <button class="ctrl-btn" onclick="stepFrame(-1)">-1F</button>
                <button class="ctrl-btn" onclick="stepFrame(1)">+1F</button>
                <button class="ctrl-btn" onclick="toggleMute(this)">Âm thanh</button>
                <button class="ctrl-btn" onclick="togglePlayerFullscreen()">Toàn màn hình</button>
            </div>
            <div id="shotStatusTag">Sẵn sàng</div>
        </div>
    </div>

    <div class="content-column">
        <header class="report-header">
            <div class="header-badges">%%BADGES_HTML%%</div>
            <h1 class="report-title">
                <a href="%%SOURCE_URL%%" target="_blank" rel="noopener">%%DISPLAY_TITLE%%</a>
            </h1>
            <div class="header-meta">
                <span>Nguồn: <a href="%%CREATOR_URL%%" target="_blank" class="creator-link">%%CREATOR%% ↗</a></span>
                <span class="meta-dot">•</span>
                <span class="meta-stat">%%SHOTS_COUNT%% cảnh</span>
                <span class="meta-dot">•</span>
                <span class="meta-stat">%%TOTAL_DUR%%</span>
                <a href="https://ytuong.fedu.vn" target="_blank" class="hub-link">Kho Ý Tưởng ↗</a>
            </div>
        </header>

        %%SCRIPT_AXIS_HTML%%

        <div class="overview-card">
            %%OVERVIEW_TEXT%%
        </div>

        %%DIALOGUE_HTML%%

        <div class="toolbar">
            <div class="tab-group">
                <button class="tab-btn active" id="tabDetailBtn" onclick="switchView('detail')">Bóc tách chi tiết</button>
                <button class="tab-btn" id="tabGridBtn" onclick="switchView('grid')">Lưới ảnh (%%SHOTS_COUNT%%)</button>
            </div>
            <button class="drawer-btn" onclick="toggleDrawer(true)">Mục lục</button>
        </div>

        <div id="storyboardView">
            %%ALL_CARDS%%
        </div>

        <div id="gridView">
            %%ALL_GRID%%
        </div>
    </div>
</div>

<div id="drawerBackdrop" class="drawer-backdrop" onclick="toggleDrawer(false)">
    <div class="drawer-panel" onclick="event.stopPropagation()">
        <div class="drawer-head">
            <span>MỤC LỤC (%%SHOTS_COUNT%%)</span>
            <button onclick="toggleDrawer(false)">&times;</button>
        </div>
        <div class="drawer-list">%%ALL_DRAWER%%</div>
    </div>
</div>

<div id="lightboxModal" onclick="closeLightbox()">
    <span class="lightbox-x" onclick="closeLightbox()">&times;</span>
    <img id="lightboxImg" onclick="event.stopPropagation()" />
    <div id="lightboxCaption"></div>
</div>

<script>
// Video source resolution - try multiple paths
const rawVideoSrc = '%%RAW_VIDEO_SRC%%';
let currentEndTime = null;

function getCandidateUrls(src) {
    if (!src) return [];
    if (src.startsWith('http://') || src.startsWith('https://')) return [src];
    let clean = src.replace(/^(\.\.\/|\.\/)*/g, '').replace(/^(videos\/|reports\/)/, '');
    return [
        'https://media.fedu.vn/videos/' + encodeURI(clean),
        '../videos/' + clean,
        './videos/' + clean,
        './' + clean
    ];
}

const candidateUrls = getCandidateUrls(rawVideoSrc);
let candidateIdx = 0;
const player = document.getElementById('mainPlayer');
window.isYtMuted = false;

function loadVideoCandidate() {
    if (!player || player.tagName === 'IFRAME' || candidateIdx >= candidateUrls.length) return;
    player.src = candidateUrls[candidateIdx];
    var link = document.getElementById('directVidLink');
    if (link) link.href = candidateUrls[candidateIdx];
    player.load();
}

if (player && player.tagName !== 'IFRAME') {
    player.onerror = function() {
        candidateIdx++;
        if (candidateIdx < candidateUrls.length) loadVideoCandidate();
    };
    loadVideoCandidate();
}

function playShot(startTime, endTime, label) {
    if (!player) return;
    currentEndTime = (typeof endTime === 'number') ? endTime : null;
    var tag = document.getElementById('shotStatusTag');
    if (tag) {
        var endTxt = currentEndTime ? ' - ' + currentEndTime.toFixed(2) + 's' : '';
        tag.innerText = (label || 'Phân cảnh') + ': [' + startTime.toFixed(2) + 's' + endTxt + ']';
    }
    if (player.tagName === 'IFRAME') {
        player.contentWindow.postMessage(JSON.stringify({
            event: 'command',
            func: 'seekTo',
            args: [startTime, true]
        }), '*');
        player.contentWindow.postMessage(JSON.stringify({
            event: 'command',
            func: 'playVideo',
            args: []
        }), '*');
    } else {
        player.currentTime = startTime;
        var p = player.play();
        if (p !== undefined) {
            p.catch(function() {
                player.muted = true;
                player.play().catch(function() {});
            });
        }
    }
    document.querySelectorAll('.shot-card').forEach(function(c) { c.classList.remove('active-playing'); });
    var cards = document.querySelectorAll('.shot-card');
    for (var i = 0; i < cards.length; i++) {
        if (cards[i].innerText.indexOf(label) !== -1) {
            cards[i].classList.add('active-playing');
            break;
        }
    }
    if (window.innerWidth < 1024) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

function setSpeed(speed, btn) {
    if (!player) return;
    if (player.tagName === 'IFRAME') {
        player.contentWindow.postMessage(JSON.stringify({
            event: 'command',
            func: 'setPlaybackRate',
            args: [speed]
        }), '*');
    } else {
        player.playbackRate = speed;
    }
    document.querySelectorAll('.speed-row .ctrl-btn').forEach(function(b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
}

function stepFrame(frames) {
    if (!player) return;
    if (player.tagName !== 'IFRAME') {
        player.pause();
        player.currentTime += (frames * (1/30));
    }
}

function toggleMute(btn) {
    if (!player) return;
    if (player.tagName === 'IFRAME') {
        window.isYtMuted = !window.isYtMuted;
        player.contentWindow.postMessage(JSON.stringify({
            event: 'command',
            func: window.isYtMuted ? 'mute' : 'unMute',
            args: []
        }), '*');
        if (btn) btn.innerText = window.isYtMuted ? 'Tắt tiếng' : 'Âm thanh';
    } else {
        player.muted = !player.muted;
        if (btn) btn.innerText = player.muted ? 'Tắt tiếng' : 'Âm thanh';
    }
}

function togglePlayerFullscreen() {
    var v = document.getElementById('mainPlayer');
    if (!v) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (v.requestFullscreen) v.requestFullscreen().catch(function(){});
        else if (v.webkitRequestFullscreen) v.webkitRequestFullscreen();
        else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
    } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(function(){});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
}

document.addEventListener('keydown', function(e) {
    if ((e.key === 'f' || e.key === 'F') && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
        togglePlayerFullscreen();
    }
    if (e.key === 'Escape') {
        closeLightbox();
        toggleDrawer(false);
    }
    if (e.key === ' ' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        if (player) player.paused ? player.play() : player.pause();
    }
});

function switchView(view) {
    var sb = document.getElementById('storyboardView');
    var grid = document.getElementById('gridView');
    var tabD = document.getElementById('tabDetailBtn');
    var tabG = document.getElementById('tabGridBtn');
    if (view === 'grid') {
        sb.style.display = 'none';
        grid.style.display = 'grid';
        tabD.classList.remove('active');
        tabG.classList.add('active');
    } else {
        sb.style.display = 'flex';
        grid.style.display = 'none';
        tabD.classList.add('active');
        tabG.classList.remove('active');
    }
}

function toggleDrawer(open) {
    var d = document.getElementById('drawerBackdrop');
    if (open) d.classList.add('open');
    else d.classList.remove('open');
}

function jumpToShot(shotNum, st, et, label) {
    toggleDrawer(false);
    switchView('detail');
    playShot(st, et, label);
    var card = document.getElementById('shot-card-' + shotNum);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function openLightbox(src, caption) {
    var modal = document.getElementById('lightboxModal');
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxCaption').innerText = caption || '';
    modal.style.display = 'flex';
}

function closeLightbox() {
    document.getElementById('lightboxModal').style.display = 'none';
}

function togglePromptAccordion(headerEl) {
    var card = headerEl.closest('.remake-prompt-card');
    if (!card) return;
    var body = card.querySelector('.prompt-accordion-body');
    var icon = card.querySelector('.toggle-icon');
    var label = card.querySelector('.toggle-label');
    if (!body) return;
    var collapsed = (body.style.display === 'none' || getComputedStyle(body).display === 'none');
    if (collapsed) {
        body.style.display = 'block';
        if (icon) icon.textContent = '▲';
        if (label) label.textContent = 'Thu gọn';
    } else {
        body.style.display = 'none';
        if (icon) icon.textContent = '▼';
        if (label) label.textContent = 'Mở xem';
    }
}

function copyMegaPrompt(e, btn) {
    if (e && e.stopPropagation) e.stopPropagation();
    var card = btn.closest('.remake-prompt-card');
    var codeEl = card ? card.querySelector('.prompt-code-content') : document.getElementById('megaPromptText');
    if (!codeEl) return;
    var text = codeEl.innerText || codeEl.textContent;
    navigator.clipboard.writeText(text).then(function() {
        var orig = btn.innerHTML;
        btn.innerHTML = '✅ Đã chép!';
        btn.style.background = '#16a34a';
        btn.style.color = '#fff';
        setTimeout(function() {
            btn.innerHTML = orig;
            btn.style.background = '';
            btn.style.color = '';
        }, 2000);
    }).catch(function() {
        alert('Lỗi sao chép, bạn bôi đen văn bản để copy nhé!');
    });
}
</script>
</body>
</html>
